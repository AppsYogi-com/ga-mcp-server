name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and tool tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check build output
        run: test -f dist/index.d.ts && node dist/cli/index.js --help

      - name: Smoke test (MCP over stdio, no credentials)
        run: npm run test:smoke

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Pack (dry run)
        run: npm pack --dry-run
